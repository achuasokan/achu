<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <filter id="plate-shadow-3" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="12" stdDeviation="16" flood-color="#3a2c1a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="spine-shadow-left-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0" />
      <stop offset="70%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="spine-shadow-right-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Sketchbook Paper Spreads -->
  <rect x="0" y="0" width="880" height="1240" fill="#f5f0e4" />
  <rect x="880" y="0" width="880" height="1240" fill="#f7f2e8" />

  <!-- Center Gutter & Crease Depth -->
  <rect x="740" y="0" width="140" height="1240" fill="url(#spine-shadow-left-3)" />
  <rect x="880" y="0" width="140" height="1240" fill="url(#spine-shadow-right-3)" />
  <line x1="880" y1="20" x2="880" y2="1220" stroke="#3d2d1b" stroke-opacity="0.28" stroke-width="1.8" />
  <circle cx="880" cy="180" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="380" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="620" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="860" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="1060" r="3.2" fill="#2b1f14" opacity="0.45" />

  <!-- ================= LEFT SPREAD: EDITORIAL SPECIFICATION ================= -->
  <g transform="translate(100, 110)">
    <!-- Plate Header -->
    <text x="0" y="30" class="mono-caps" font-size="12" fill="#8c775f" font-weight="600">PLATE III · MEDIA &amp; STREAMING INTERFACE</text>
    <text x="560" y="30" class="mono-caps" font-size="12" fill="#8c775f" text-anchor="end">REACT WEB APPLICATION · 2024</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <!-- Project Title -->
    <text x="0" y="115" class="serif-display" font-size="54" fill="#241f1a" letter-spacing="-0.01em">YouTube Platform</text>
    <text x="0" y="152" class="serif-display" font-style="italic" font-size="28" fill="#d92323">Video Streaming &amp; Discovery Interface</text>

    <!-- Tech Stack Badge Strip -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="38" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">React</text>
      <rect x="84" y="0" width="92" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="130" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">REST APIs</text>
      <rect x="184" y="0" width="108" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="238" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Video Player</text>
      <rect x="300" y="0" width="112" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="356" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">TailwindCSS</text>
    </g>

    <!-- Narrative Description -->
    <g transform="translate(0, 260)" class="serif-body" font-size="19" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">A dynamic recreation of YouTube’s modern web client, engineered to handle</text>
      <text x="0" y="32">large video catalogues, responsive multi-channel filtering, instant category</text>
      <text x="0" y="64">switching, and custom video playback. Deployed on Vercel with clean modular</text>
      <text x="0" y="96">component architecture and real-time query debounce.</text>
    </g>

    <line x1="0" y1="400" x2="560" y2="400" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <!-- Technical Architectural Highlights -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <!-- Item 1 -->
      <circle cx="6" cy="35" r="3" fill="#d92323" />
      <text x="22" y="39" class="sans" font-size="15" font-weight="600" fill="#25211c">Asynchronous Feed Ingestion &amp; Search</text>
      <text x="22" y="60" class="serif-body" font-size="16" fill="#4d443a">Live search bar with debounced API queries and category suggestion pills.</text>

      <!-- Item 2 -->
      <circle cx="6" cy="105" r="3" fill="#d92323" />
      <text x="22" y="109" class="sans" font-size="15" font-weight="600" fill="#25211c">Responsive Multi-Grid Media Cards</text>
      <text x="22" y="130" class="serif-body" font-size="16" fill="#4d443a">Adaptive thumbnail cards with duration badges, channel avatars, and view counts.</text>

      <!-- Item 3 -->
      <circle cx="6" cy="175" r="3" fill="#d92323" />
      <text x="22" y="179" class="sans" font-size="15" font-weight="600" fill="#25211c">Collapsible Multi-Tier Navigation</text>
      <text x="22" y="200" class="serif-body" font-size="16" fill="#4d443a">Sidebar navigation with library history, subscriptions, and drawer toggles.</text>
    </g>

    <!-- Red Seal / Signature Stamp -->
    <g transform="translate(0, 780)">
      <rect x="0" y="0" width="170" height="64" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="8 2" opacity="0.85" />
      <text x="85" y="27" class="mono-caps" font-size="10" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="85" y="47" class="mono-caps" font-size="8.5" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="200" y="32" class="serif-body" font-size="15" font-style="italic" fill="#66594b">youtube-lime-seven.vercel.app</text>
      <text x="200" y="52" class="mono-caps" font-size="9" fill="#887866">Live Production Deployment</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD: REAL APPLICATION WORK SHOWCASE ================= -->
  <g transform="translate(930, 90)">
    <!-- Mounted Mat Frame -->
    <rect x="0" y="0" width="730" height="990" rx="8" fill="#ffffff" filter="url(#plate-shadow-3)" />

    <!-- Browser Chrome Header Bar -->
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#f1f3f4" />
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="90" y="8" width="460" height="26" rx="5" fill="#ffffff" stroke="#dadce0" stroke-width="1" />
    <text x="110" y="25" class="mono-caps" font-size="10" fill="#5f6368">https://youtube-lime-seven.vercel.app</text>

    <!-- YouTube UI Container -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="730" height="948" fill="#ffffff" />

      <!-- YouTube Top Header -->
      <rect x="0" y="0" width="730" height="56" fill="#ffffff" stroke="#e5e5e5" stroke-width="1" />
      <!-- Burger menu -->
      <line x1="24" y1="22" x2="42" y2="22" stroke="#606060" stroke-width="2" />
      <line x1="24" y1="28" x2="42" y2="28" stroke="#606060" stroke-width="2" />
      <line x1="24" y1="34" x2="42" y2="34" stroke="#606060" stroke-width="2" />

      <!-- YouTube Logo -->
      <g transform="translate(56, 17)">
        <rect x="0" y="2" width="30" height="20" rx="6" fill="#ff0000" />
        <polygon points="12,7 21,12 12,17" fill="#ffffff" />
        <text x="36" y="17" class="sans" font-size="18" font-weight="800" fill="#212121" letter-spacing="-0.04em">YouTube</text>
      </g>

      <!-- Search Bar -->
      <g transform="translate(260, 12)">
        <rect x="0" y="0" width="320" height="32" rx="2" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
        <text x="14" y="21" class="sans" font-size="13" fill="#888888">Search</text>
        <rect x="270" y="0" width="50" height="32" fill="#f8f8f8" stroke="#cccccc" stroke-width="1" />
        <circle cx="292" cy="15" r="5" fill="none" stroke="#606060" stroke-width="1.6" />
        <line x1="296" y1="19" x2="303" y2="26" stroke="#606060" stroke-width="1.6" />
      </g>

      <!-- Sidebar -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="130" height="892" fill="#ffffff" stroke="#e5e5e5" stroke-width="1" />

        <!-- Home (Active) -->
        <rect x="0" y="10" width="130" height="36" fill="#f2f2f2" />
        <text x="44" y="33" class="sans" font-size="12" font-weight="700" fill="#ff0000">Home</text>
        <!-- Trending -->
        <text x="44" y="73" class="sans" font-size="12" fill="#606060">Trending</text>
        <!-- Subscriptions -->
        <text x="44" y="113" class="sans" font-size="12" fill="#606060">Subscriptions</text>
        <line x1="16" y1="135" x2="114" y2="135" stroke="#e5e5e5" stroke-width="1" />
        <text x="18" y="160" class="mono-caps" font-size="9" fill="#909090">LIBRARY</text>
        <text x="44" y="185" class="sans" font-size="12" fill="#606060">History</text>
        <text x="44" y="215" class="sans" font-size="12" fill="#606060">Watch Later</text>
        <text x="44" y="245" class="sans" font-size="12" fill="#606060">Liked Videos</text>
      </g>

      <!-- Main Video Grid Area -->
      <g transform="translate(148, 70)">
        <text x="0" y="16" class="sans" font-size="17" font-weight="700" fill="#0f0f0f">Recommended</text>

        <!-- Video Row 1 -->
        <g transform="translate(0, 32)">
          <!-- Card 1: YouTube Rewind -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#000000" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">6:53</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">YouTube Rewind: The...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">YouTube Spotlight · 190M</text>
          </g>

          <!-- Card 2: National Parks -->
          <g transform="translate(192, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#1b3b24" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">1:02</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">Explore Hidden Worlds...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">Google · 5M views</text>
          </g>

          <!-- Card 3: Internet -->
          <g transform="translate(384, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#2b4468" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">7:37</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">A Journey to the Bottom...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">Nat and Friends · 255K</text>
          </g>
        </g>

        <!-- Video Row 2 -->
        <g transform="translate(0, 210)">
          <!-- Card 4 -->
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#382442" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">2:53</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">Beyond the Map: Rio...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">Google · 91K views</text>
          </g>

          <!-- Card 5 -->
          <g transform="translate(192, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#4a3e2a" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">1:49</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">Introducing Google Trips...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">Google · 1.3M views</text>
          </g>

          <!-- Card 6 -->
          <g transform="translate(384, 0)">
            <rect x="0" y="0" width="176" height="104" rx="4" fill="#2a3c3c" />
            <rect x="136" y="82" width="34" height="16" rx="2" fill="#000000" opacity="0.85" />
            <text x="153" y="94" class="sans" font-size="9" fill="#ffffff" text-anchor="middle">2:01</text>
            <text x="0" y="124" class="sans" font-size="12" font-weight="600" fill="#0f0f0f">From Syria to Canada...</text>
            <text x="0" y="140" class="sans" font-size="10.5" fill="#606060">Google · 333K views</text>
          </g>
        </g>
      </g>

      <!-- Real Screenshot Fallback Layer -->
      <image href="thum1.jpg" x="0" y="0" width="730" height="948" preserveAspectRatio="xMidYMid slice" opacity="0.92" />
    </g>

    <!-- Bottom Caption inside Plate -->
    <text x="365" y="1030" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 3.0 — YouTube streaming feed with debounced search and responsive category rails.
    </text>
  </g>
</svg>
