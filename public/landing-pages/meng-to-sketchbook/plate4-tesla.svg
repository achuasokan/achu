<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <filter id="plate-shadow-4" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="12" stdDeviation="16" flood-color="#3a2c1a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="spine-shadow-left-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0" />
      <stop offset="70%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="spine-shadow-right-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Sketchbook Paper Spreads -->
  <rect x="0" y="0" width="880" height="1240" fill="#f5f0e4" />
  <rect x="880" y="0" width="880" height="1240" fill="#f7f2e8" />

  <!-- Center Gutter & Crease Depth -->
  <rect x="740" y="0" width="140" height="1240" fill="url(#spine-shadow-left-4)" />
  <rect x="880" y="0" width="140" height="1240" fill="url(#spine-shadow-right-4)" />
  <line x1="880" y1="20" x2="880" y2="1220" stroke="#3d2d1b" stroke-opacity="0.28" stroke-width="1.8" />
  <circle cx="880" cy="180" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="380" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="620" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="860" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="1060" r="3.2" fill="#2b1f14" opacity="0.45" />

  <!-- ================= LEFT SPREAD: EDITORIAL SPECIFICATION ================= -->
  <g transform="translate(100, 110)">
    <!-- Plate Header -->
    <text x="0" y="30" class="mono-caps" font-size="12" fill="#8c775f" font-weight="600">PLATE IV · AUTOMOTIVE DIGITAL EXPERIENCE</text>
    <text x="560" y="30" class="mono-caps" font-size="12" fill="#8c775f" text-anchor="end">WEB DESIGN · 2024</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <!-- Project Title -->
    <text x="0" y="115" class="serif-display" font-size="54" fill="#241f1a" letter-spacing="-0.01em">Tesla Experience</text>
    <text x="0" y="152" class="serif-display" font-style="italic" font-size="28" fill="#c02828">Automotive Web Platform &amp; Showroom</text>

    <!-- Tech Stack Badge Strip -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="38" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">HTML5</text>
      <rect x="84" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="122" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">CSS3</text>
      <rect x="168" y="0" width="108" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="222" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">JavaScript</text>
      <rect x="284" y="0" width="112" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="340" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Responsive UI</text>
    </g>

    <!-- Narrative Description -->
    <g transform="translate(0, 260)" class="serif-body" font-size="19" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">A pixel-accurate re-creation of Tesla’s flagship digital showroom, showcasing</text>
      <text x="0" y="32">the Model S pre-owned catalogue, multi-parameter location and trim filters,</text>
      <text x="0" y="64">and minimal editorial typography. Built with pure semantic web standards</text>
      <text x="0" y="96">and deployed on Vercel with instant edge responsiveness.</text>
    </g>

    <line x1="0" y1="400" x2="560" y2="400" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <!-- Technical Architectural Highlights -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <!-- Item 1 -->
      <circle cx="6" cy="35" r="3" fill="#c02828" />
      <text x="22" y="39" class="sans" font-size="15" font-weight="600" fill="#25211c">Automotive Specification Hierarchy</text>
      <text x="22" y="60" class="serif-body" font-size="16" fill="#4d443a">Pre-owned fleet filters by trim (P85, 85), mileage history, and location tags.</text>

      <!-- Item 2 -->
      <circle cx="6" cy="105" r="3" fill="#c02828" />
      <text x="22" y="109" class="sans" font-size="15" font-weight="600" fill="#25211c">High-Fidelity Studio Renders &amp; Contrast</text>
      <text x="22" y="130" class="serif-body" font-size="16" fill="#4d443a">Precise lighting ramps, vehicle shadows, and metallic red finish presentation.</text>

      <!-- Item 3 -->
      <circle cx="6" cy="175" r="3" fill="#c02828" />
      <text x="22" y="179" class="sans" font-size="15" font-weight="600" fill="#25211c">Fluid Responsive Grid Breakdown</text>
      <text x="22" y="200" class="serif-body" font-size="16" fill="#4d443a">Seamless scaling across desktop monitor widths down to compact mobile screens.</text>
    </g>

    <!-- Red Seal / Signature Stamp -->
    <g transform="translate(0, 780)">
      <rect x="0" y="0" width="170" height="64" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="8 2" opacity="0.85" />
      <text x="85" y="27" class="mono-caps" font-size="10" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="85" y="47" class="mono-caps" font-size="8.5" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="200" y="32" class="serif-body" font-size="15" font-style="italic" fill="#66594b">tesla-clone-sage-three.vercel.app</text>
      <text x="200" y="52" class="mono-caps" font-size="9" fill="#887866">Live Production Deployment</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD: REAL APPLICATION WORK SHOWCASE ================= -->
  <g transform="translate(930, 90)">
    <!-- Mounted Mat Frame -->
    <rect x="0" y="0" width="730" height="990" rx="8" fill="#ffffff" filter="url(#plate-shadow-4)" />

    <!-- Browser Chrome Header Bar -->
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#222222" />
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="90" y="8" width="460" height="26" rx="5" fill="#141414" />
    <text x="110" y="25" class="mono-caps" font-size="10" fill="#8e8e8e">https://tesla-clone-sage-three.vercel.app</text>

    <!-- Tesla UI Layout Graphic Container -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="730" height="948" fill="#ffffff" />

      <!-- Top Black Nav Bar -->
      <rect x="0" y="0" width="730" height="48" fill="#222222" />
      <text x="40" y="29" class="sans" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="0.28em">TESLA</text>
      <g transform="translate(180, 29)" class="sans" font-size="11" font-weight="600" fill="#d0d0d0" letter-spacing="0.08em">
        <text x="0" y="0">MODEL S</text>
        <text x="80" y="0">MODEL X</text>
        <text x="160" y="0">SUPERCHARGER</text>
        <text x="290" y="0">UPDATES</text>
      </g>

      <!-- Headline -->
      <text x="40" y="96" class="sans" font-size="28" font-weight="300" fill="#333333">MODEL S</text>
      <text x="40" y="130" class="sans" font-size="16" font-weight="600" fill="#555555">Pre-Owned Model S</text>
      <text x="40" y="148" class="sans" font-size="11.5" fill="#888888">Every pre-owned Model S comes with a 4 year, 50,000 mile limited warranty.</text>

      <!-- Featured Red Model S Graphic Silhouette -->
      <g transform="translate(60, 160)">
        <!-- Car Body Outline -->
        <path d="M60,180 Q140,80 280,70 Q420,70 540,160 Q580,180 580,210 Q580,230 520,230 L80,230 Q40,230 40,210 Z" fill="#cc1c24" />
        <!-- Cabin Glass Roof -->
        <path d="M160,160 Q220,90 320,86 Q400,86 460,160 Z" fill="#181818" />
        <!-- Wheels -->
        <circle cx="160" cy="225" r="38" fill="#111111" stroke="#888888" stroke-width="4" />
        <circle cx="460" cy="225" r="38" fill="#111111" stroke="#888888" stroke-width="4" />
        <circle cx="160" cy="225" r="16" fill="#e0e0e0" />
        <circle cx="460" cy="225" r="16" fill="#e0e0e0" />
      </g>

      <!-- Filter Controls Strip -->
      <g transform="translate(40, 440)">
        <text x="0" y="18" class="sans" font-size="12" font-weight="600" fill="#666666">Filter</text>
        <rect x="45" y="0" width="180" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
        <text x="56" y="18" class="sans" font-size="11" fill="#444444">San Francisco Bay Area ▾</text>
        <rect x="235" y="0" width="140" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
        <text x="246" y="18" class="sans" font-size="11" fill="#444444">Any Model S ▾</text>
        <rect x="385" y="0" width="110" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
        <text x="396" y="18" class="sans" font-size="11" fill="#444444">Any Color ▾</text>
      </g>

      <!-- Three Pre-Owned Cards Grid -->
      <g transform="translate(40, 490)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="206" height="220" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
          <ellipse cx="103" cy="90" rx="80" ry="32" fill="#cc1c24" />
          <text x="103" y="155" class="sans" font-size="16" font-weight="700" fill="#cc1c24" text-anchor="middle">P85</text>
          <text x="103" y="175" class="sans" font-size="11" fill="#777777" text-anchor="middle">2012 · 37,187 miles · $53,650</text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(222, 0)">
          <rect x="0" y="0" width="206" height="220" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
          <ellipse cx="103" cy="90" rx="80" ry="32" fill="#cc1c24" />
          <text x="103" y="155" class="sans" font-size="16" font-weight="700" fill="#444444" text-anchor="middle">85</text>
          <text x="103" y="175" class="sans" font-size="11" fill="#777777" text-anchor="middle">2013 · 19,248 miles · $55,150</text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(444, 0)">
          <rect x="0" y="0" width="206" height="220" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
          <ellipse cx="103" cy="90" rx="80" ry="32" fill="#444a50" />
          <text x="103" y="155" class="sans" font-size="16" font-weight="700" fill="#444444" text-anchor="middle">85</text>
          <text x="103" y="175" class="sans" font-size="11" fill="#777777" text-anchor="middle">2013 · 13,056 miles · $56,150</text>
        </g>
      </g>

      <!-- Real Screenshot Fallback Layer -->
      <image href="Blog3.jpg" x="0" y="0" width="730" height="948" preserveAspectRatio="xMidYMid slice" opacity="0.92" />
    </g>

    <!-- Bottom Caption inside Plate -->
    <text x="365" y="1030" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 4.0 — Tesla Model S pre-owned fleet catalogue with multi-filter query states.
    </text>
  </g>
</svg>
