<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <filter id="plate-shadow-5" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="12" stdDeviation="16" flood-color="#3a2c1a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="spine-shadow-left-5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0" />
      <stop offset="70%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="spine-shadow-right-5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="blue-hero-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3d91" />
      <stop offset="50%" stop-color="#1456c2" />
      <stop offset="100%" stop-color="#0b2c68" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Sketchbook Paper Spreads -->
  <rect x="0" y="0" width="880" height="1240" fill="#f5f0e4" />
  <rect x="880" y="0" width="880" height="1240" fill="#f7f2e8" />

  <!-- Center Gutter & Crease Depth -->
  <rect x="740" y="0" width="140" height="1240" fill="url(#spine-shadow-left-5)" />
  <rect x="880" y="0" width="140" height="1240" fill="url(#spine-shadow-right-5)" />
  <line x1="880" y1="20" x2="880" y2="1220" stroke="#3d2d1b" stroke-opacity="0.28" stroke-width="1.8" />
  <circle cx="880" cy="180" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="380" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="620" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="860" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="1060" r="3.2" fill="#2b1f14" opacity="0.45" />

  <!-- ================= LEFT SPREAD: EDITORIAL SPECIFICATION ================= -->
  <g transform="translate(100, 110)">
    <!-- Plate Header -->
    <text x="0" y="30" class="mono-caps" font-size="12" fill="#8c775f" font-weight="600">PLATE V · DIGITAL HUB &amp; ARCHITECTURE</text>
    <text x="560" y="30" class="mono-caps" font-size="12" fill="#8c775f" text-anchor="end">FULL STACK · 2024</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <!-- Project Title -->
    <text x="0" y="115" class="serif-display" font-size="54" fill="#241f1a" letter-spacing="-0.01em">Techno Hub</text>
    <text x="0" y="152" class="serif-display" font-style="italic" font-size="28" fill="#1b5eb8">Digital Agency &amp; Architecture Platform</text>

    <!-- Tech Stack Badge Strip -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="86" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="43" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Full Stack</text>
      <rect x="94" y="0" width="86" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="137" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Node.js</text>
      <rect x="188" y="0" width="94" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="235" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">JavaScript</text>
      <rect x="290" y="0" width="100" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="340" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">UI Systems</text>
    </g>

    <!-- Narrative Description -->
    <g transform="translate(0, 260)" class="serif-body" font-size="19" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">Techno Hub represents full-stack digital craft: uniting modular component</text>
      <text x="0" y="32">composition, fluid hero carousels, responsive mobile navigation, and rock-solid</text>
      <text x="0" y="64">REST API communication. Engineered with clean architecture and SOLID</text>
      <text x="0" y="96">principles, creating maintainable, high-performance web systems.</text>
    </g>

    <line x1="0" y1="400" x2="560" y2="400" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <!-- Technical Architectural Highlights -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <!-- Item 1 -->
      <circle cx="6" cy="35" r="3" fill="#1b5eb8" />
      <text x="22" y="39" class="sans" font-size="15" font-weight="600" fill="#25211c">Clean Architecture &amp; Modular Separation</text>
      <text x="22" y="60" class="serif-body" font-size="16" fill="#4d443a">Domain isolation between business rules, controllers, and presentation layers.</text>

      <!-- Item 2 -->
      <circle cx="6" cy="105" r="3" fill="#1b5eb8" />
      <text x="22" y="109" class="sans" font-size="15" font-weight="600" fill="#25211c">Interactive Carousel &amp; Motion Controls</text>
      <text x="22" y="130" class="serif-body" font-size="16" fill="#4d443a">Fluid touch-enabled slider track with indicator dashes and directional chevrons.</text>

      <!-- Item 3 -->
      <circle cx="6" cy="175" r="3" fill="#1b5eb8" />
      <text x="22" y="179" class="sans" font-size="15" font-weight="600" fill="#25211c">Responsive Header &amp; Hamburger Drawer</text>
      <text x="22" y="200" class="serif-body" font-size="16" fill="#4d443a">Accessible navigation structure adapting gracefully from wide screens to mobile.</text>
    </g>

    <!-- Red Seal / Signature Stamp -->
    <g transform="translate(0, 780)">
      <rect x="0" y="0" width="170" height="64" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="8 2" opacity="0.85" />
      <text x="85" y="27" class="mono-caps" font-size="10" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="85" y="47" class="mono-caps" font-size="8.5" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="200" y="32" class="serif-body" font-size="15" font-style="italic" fill="#66594b">Crafted with Clean Architecture &amp; Node</text>
      <text x="200" y="52" class="mono-caps" font-size="9" fill="#887866">github.com/achuasokan</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD: REAL APPLICATION WORK SHOWCASE ================= -->
  <g transform="translate(930, 90)">
    <!-- Mounted Mat Frame -->
    <rect x="0" y="0" width="730" height="990" rx="8" fill="#ffffff" filter="url(#plate-shadow-5)" />

    <!-- Browser Chrome Header Bar -->
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#f1f3f4" />
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="90" y="8" width="460" height="26" rx="5" fill="#ffffff" stroke="#dadce0" stroke-width="1" />
    <text x="110" y="25" class="mono-caps" font-size="10" fill="#5f6368">https://techno-web.app</text>

    <!-- Techno-Web UI Layout Graphic Container -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="730" height="948" fill="#ffffff" />

      <!-- Navbar -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="730" height="74" fill="#ffffff" stroke="#eeeeee" stroke-width="1" />
        <text x="40" y="47" class="sans" font-size="28" font-weight="700" fill="#222222">Techno-<tspan fill="#f59e0b">web</tspan></text>

        <!-- Hamburger Icon Box -->
        <rect x="620" y="17" width="50" height="40" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1" />
        <line x1="632" y1="27" x2="658" y2="27" stroke="#666666" stroke-width="2" />
        <line x1="632" y1="37" x2="658" y2="37" stroke="#666666" stroke-width="2" />
        <line x1="632" y1="47" x2="658" y2="47" stroke="#666666" stroke-width="2" />
      </g>

      <!-- Blue Hero Showcase Banner -->
      <g transform="translate(0, 74)">
        <rect x="0" y="0" width="730" height="874" fill="url(#blue-hero-glow)" />

        <!-- Stylized Portrait Silhouette in Blue Tonal Gradient -->
        <circle cx="365" cy="400" r="180" fill="#1d4ed8" opacity="0.6" />
        <circle cx="365" cy="360" r="110" fill="#0b2c68" opacity="0.8" />
        <path d="M220,580 Q365,480 510,580 L510,874 L220,874 Z" fill="#0b2c68" opacity="0.9" />

        <!-- Left Nav Chevron Arrow -->
        <g transform="translate(40, 437)">
          <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.12" />
          <path d="M6,-14 L-8,0 L6,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Right Nav Chevron Arrow -->
        <g transform="translate(690, 437)">
          <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.12" />
          <path d="M-6,-14 L8,0 L-6,14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        </g>

        <!-- Carousel Pagination Dots -->
        <g transform="translate(305, 820)">
          <rect x="0" y="0" width="36" height="4" rx="2" fill="#ffffff" opacity="0.5" />
          <rect x="46" y="0" width="36" height="4" rx="2" fill="#ffffff" opacity="0.5" />
          <rect x="92" y="0" width="36" height="4" rx="2" fill="#ffffff" opacity="1" />
        </g>
      </g>

      <!-- Real Screenshot Fallback Layer -->
      <image href="thum2.png" x="0" y="0" width="730" height="948" preserveAspectRatio="xMidYMid slice" opacity="0.92" />
    </g>

    <!-- Bottom Caption inside Plate -->
    <text x="365" y="1030" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 5.0 — Techno-Web digital hub with clean navigation and interactive hero carousel.
    </text>
  </g>
</svg>
