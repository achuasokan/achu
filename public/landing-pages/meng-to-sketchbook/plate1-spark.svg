<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <!-- Paper texture filters -->
    <filter id="paper-texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffdf7" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="60" elevation="50" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>
    <filter id="plate-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="12" stdDeviation="16" flood-color="#3a2c1a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="spine-shadow-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0" />
      <stop offset="70%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="spine-shadow-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Sketchbook Paper Spreads -->
  <rect x="0" y="0" width="880" height="1240" fill="#f5f0e4" />
  <rect x="880" y="0" width="880" height="1240" fill="#f7f2e8" />

  <!-- Center Gutter & Crease Depth -->
  <rect x="740" y="0" width="140" height="1240" fill="url(#spine-shadow-left)" />
  <rect x="880" y="0" width="140" height="1240" fill="url(#spine-shadow-right)" />
  <line x1="880" y1="20" x2="880" y2="1220" stroke="#3d2d1b" stroke-opacity="0.28" stroke-width="1.8" />
  <!-- Stitched spine thread holes -->
  <circle cx="880" cy="180" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="380" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="620" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="860" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="1060" r="3.2" fill="#2b1f14" opacity="0.45" />

  <!-- ================= LEFT SPREAD: EDITORIAL SPECIFICATION ================= -->
  <g transform="translate(100, 110)">
    <!-- Plate Header -->
    <text x="0" y="30" class="mono-caps" font-size="12" fill="#8c775f" font-weight="600">PLATE I · SELECTED REAL-TIME PLATFORM</text>
    <text x="560" y="30" class="mono-caps" font-size="12" fill="#8c775f" text-anchor="end">PRODUCTION SYSTEM · 2025</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <!-- Project Title -->
    <text x="0" y="115" class="serif-display" font-size="54" fill="#241f1a" letter-spacing="-0.01em">Spark Dating</text>
    <text x="0" y="152" class="serif-display" font-style="italic" font-size="28" fill="#e14d68">Real-time Connection &amp; Matchmaking Engine</text>

    <!-- Tech Stack Badge Strip -->
    <g transform="translate(0, 185)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="86" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="43" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Next.js 16</text>
      <!-- Badge 2 -->
      <rect x="94" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="132" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">React 19</text>
      <!-- Badge 3 -->
      <rect x="178" y="0" width="94" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="225" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Socket.IO</text>
      <!-- Badge 4 -->
      <rect x="280" y="0" width="112" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="336" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Redux Toolkit</text>
      <!-- Badge 5 -->
      <rect x="400" y="0" width="108" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="454" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">TailwindCSS 4</text>
    </g>

    <!-- Narrative Description -->
    <g transform="translate(0, 260)" class="serif-body" font-size="19" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">Spark is a modern, full-featured dating web platform engineered for real-time</text>
      <text x="0" y="32">discovery, responsive profile matching, and instant interactive chat. Built on</text>
      <text x="0" y="64">Next.js 16 App Router and React 19, the interface provides a friction-free</text>
      <text x="0" y="96">experience with fluid Framer Motion transitions and persistent dark aesthetics.</text>
    </g>

    <line x1="0" y1="400" x2="560" y2="400" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <!-- Technical Architectural Highlights -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <!-- Item 1 -->
      <circle cx="6" cy="35" r="3" fill="#e14d68" />
      <text x="22" y="39" class="sans" font-size="15" font-weight="600" fill="#25211c">Full-Duplex Socket.IO Live Communication</text>
      <text x="22" y="60" class="serif-body" font-size="16" fill="#4d443a">Instant messaging, unread count badges, and online presence indicators.</text>

      <!-- Item 2 -->
      <circle cx="6" cy="105" r="3" fill="#e14d68" />
      <text x="22" y="109" class="sans" font-size="15" font-weight="600" fill="#25211c">Redux Toolkit State Normalization</text>
      <text x="22" y="130" class="serif-body" font-size="16" fill="#4d443a">Synchronized client cache for user profiles, conversations, and preferences.</text>

      <!-- Item 3 -->
      <circle cx="6" cy="175" r="3" fill="#e14d68" />
      <text x="22" y="179" class="sans" font-size="15" font-weight="600" fill="#25211c">Google OAuth &amp; Multi-Factor Auth Flow</text>
      <text x="22" y="200" class="serif-body" font-size="16" fill="#4d443a">Secure JWT session storage, validation schemas with Zod and Hook Form.</text>
    </g>

    <!-- Red Seal / Signature Stamp -->
    <g transform="translate(0, 780)">
      <rect x="0" y="0" width="170" height="64" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="8 2" opacity="0.85" />
      <text x="85" y="27" class="mono-caps" font-size="10" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="85" y="47" class="mono-caps" font-size="8.5" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="200" y="32" class="serif-body" font-size="15" font-style="italic" fill="#66594b">Crafted with Next.js 16, TypeScript, &amp; GSAP</text>
      <text x="200" y="52" class="mono-caps" font-size="9" fill="#887866">github.com/achuasokan</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD: REAL APPLICATION WORK SHOWCASE ================= -->
  <g transform="translate(930, 90)">
    <!-- Mounted Mat Frame -->
    <rect x="0" y="0" width="730" height="990" rx="8" fill="#141416" filter="url(#plate-shadow)" />

    <!-- Browser Chrome Header Bar -->
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#1e1e24" />
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="90" y="8" width="460" height="26" rx="5" fill="#0d0d10" />
    <text x="110" y="25" class="mono-caps" font-size="10" fill="#757585">https://spark-dating.app/home</text>

    <!-- Embedded Real Application Graphic Container -->
    <g transform="translate(0, 42)">
      <!-- Top Hero Section of Spark -->
      <rect x="0" y="0" width="730" height="380" fill="#08080a" />

      <!-- Left Sidebar Mock -->
      <rect x="0" y="0" width="56" height="948" fill="#0c0d11" stroke="#1f222e" stroke-width="1" />
      <!-- Spark flame logo -->
      <circle cx="28" cy="34" r="14" fill="#e14d68" />
      <path d="M28,24 C31,28 35,32 32,38 C30,41 26,41 24,38 C22,34 25,30 28,24 Z" fill="#ffffff" />
      <!-- Nav icon dots -->
      <circle cx="28" cy="74" r="5" fill="#888899" />
      <circle cx="28" cy="114" r="5" fill="#888899" />
      <circle cx="28" cy="154" r="5" fill="#e14d68" />
      <circle cx="28" cy="194" r="5" fill="#888899" />

      <!-- Hero Banner Content -->
      <g transform="translate(86, 60)">
        <text x="0" y="44" class="sans" font-size="34" font-weight="800" fill="#ffffff">Find Your Perfect Match</text>
        <text x="0" y="78" class="sans" font-size="15" fill="#b0b0c0">Discover amazing people near you and create meaningful connections.</text>

        <!-- CTA Button -->
        <rect x="0" y="105" width="168" height="44" rx="8" fill="#e14d68" />
        <text x="84" y="132" class="sans" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Start Matching</text>
      </g>

      <!-- Profiles Grid Header -->
      <g transform="translate(86, 260)">
        <text x="0" y="0" class="sans" font-size="16" font-weight="700" fill="#ffffff">Featured Matches</text>
        <text x="540" y="0" class="mono-caps" font-size="10.5" fill="#e14d68" text-anchor="end">VIEW ALL (240+)</text>
      </g>

      <!-- Profiles Grid -->
      <g transform="translate(86, 280)">
        <!-- Card 1: Sophie -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#2b2d3d" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#44485e" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Sophie, 24</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#e14d68" text-anchor="middle">ONLINE</text>
        </g>

        <!-- Card 2: Emma -->
        <g transform="translate(126, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#352e3d" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#5a4768" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Emma, 22</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#38d39f" text-anchor="middle">NEW MATCH</text>
        </g>

        <!-- Card 3: Charu -->
        <g transform="translate(252, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#2b3838" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#425858" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Charu C.</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#e14d68" text-anchor="middle">ONLINE</text>
        </g>

        <!-- Card 4: Meenakshi -->
        <g transform="translate(378, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#3b352b" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#635742" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Meenakshi</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#888899" text-anchor="middle">2h AGO</text>
        </g>

        <!-- Card 5: Mrnul -->
        <g transform="translate(504, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#2d2b38" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#4e4860" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Mrnul, 26</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#e14d68" text-anchor="middle">ONLINE</text>
        </g>
      </g>

      <!-- Second Row of Matches -->
      <g transform="translate(86, 460)">
        <!-- Card 6: Kavya -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#3b2b35" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#604255" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Kavya, 23</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#38d39f" text-anchor="middle">VERIFIED</text>
        </g>

        <!-- Card 7: Aisha -->
        <g transform="translate(126, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#2a382c" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#425845" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Aisha, 25</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#e14d68" text-anchor="middle">ONLINE</text>
        </g>

        <!-- Card 8: Nisha -->
        <g transform="translate(252, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#35352c" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#585844" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Nisha, 21</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#888899" text-anchor="middle">ACTIVE</text>
        </g>

        <!-- Card 9: Divya -->
        <g transform="translate(378, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#2c3138" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#454c58" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Divya, 24</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#38d39f" text-anchor="middle">VERIFIED</text>
        </g>

        <!-- Card 10: Arya -->
        <g transform="translate(504, 0)">
          <rect x="0" y="0" width="112" height="154" rx="8" fill="#1b1c24" stroke="#2c2d3a" stroke-width="1" />
          <circle cx="56" cy="62" r="38" fill="#382c2c" />
          <path d="M38,92 C38,76 74,76 74,92 Z" fill="#5c4545" />
          <text x="56" y="132" class="sans" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Arya, 27</text>
          <text x="56" y="146" class="mono-caps" font-size="8" fill="#e14d68" text-anchor="middle">ONLINE</text>
        </g>
      </g>

      <!-- Real Screenshot Fallback Layer -->
      <image href="spark-homepage.png" x="56" y="0" width="674" height="948" preserveAspectRatio="xMidYMid slice" opacity="0.92" />
    </g>

    <!-- Bottom Caption inside Plate -->
    <text x="365" y="1030" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 1.0 — Spark homepage &amp; matchmaking engine with real-time Socket.IO communication.
    </text>
  </g>
</svg>
