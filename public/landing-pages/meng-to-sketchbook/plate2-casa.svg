<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1240" width="1760" height="1240">
  <defs>
    <filter id="plate-shadow-2" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="3" dy="12" stdDeviation="16" flood-color="#3a2c1a" flood-opacity="0.22" />
    </filter>
    <linearGradient id="spine-shadow-left-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0" />
      <stop offset="70%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0.32" />
    </linearGradient>
    <linearGradient id="spine-shadow-right-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3c2f1e" stop-opacity="0.32" />
      <stop offset="30%" stop-color="#3c2f1e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3c2f1e" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="sunset-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97736" />
      <stop offset="50%" stop-color="#e8984a" />
      <stop offset="100%" stop-color="#f5c26b" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Base Sketchbook Paper Spreads -->
  <rect x="0" y="0" width="880" height="1240" fill="#f5f0e4" />
  <rect x="880" y="0" width="880" height="1240" fill="#f7f2e8" />

  <!-- Center Gutter & Crease Depth -->
  <rect x="740" y="0" width="140" height="1240" fill="url(#spine-shadow-left-2)" />
  <rect x="880" y="0" width="140" height="1240" fill="url(#spine-shadow-right-2)" />
  <line x1="880" y1="20" x2="880" y2="1220" stroke="#3d2d1b" stroke-opacity="0.28" stroke-width="1.8" />
  <!-- Stitched spine thread holes -->
  <circle cx="880" cy="180" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="380" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="620" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="860" r="3.2" fill="#2b1f14" opacity="0.45" />
  <circle cx="880" cy="1060" r="3.2" fill="#2b1f14" opacity="0.45" />

  <!-- ================= LEFT SPREAD: EDITORIAL SPECIFICATION ================= -->
  <g transform="translate(100, 110)">
    <!-- Plate Header -->
    <text x="0" y="30" class="mono-caps" font-size="12" fill="#8c775f" font-weight="600">PLATE II · CINEMATIC RESORT WEB EXPERIENCE</text>
    <text x="560" y="30" class="mono-caps" font-size="12" fill="#8c775f" text-anchor="end">NEXT.JS 16 · 2025</text>
    <line x1="0" y1="46" x2="560" y2="46" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <!-- Project Title -->
    <text x="0" y="115" class="serif-display" font-size="54" fill="#241f1a" letter-spacing="-0.01em">Casa Ananda</text>
    <text x="0" y="152" class="serif-display" font-style="italic" font-size="28" fill="#c46a2a">Luxury Resort &amp; Villa Showcase</text>

    <!-- Tech Stack Badge Strip -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="86" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="43" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Next.js 16</text>
      <rect x="94" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="132" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">React 19</text>
      <rect x="178" y="0" width="76" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="216" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">GSAP 3</text>
      <rect x="262" y="0" width="100" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="312" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Lenis Scroll</text>
      <rect x="370" y="0" width="112" height="26" rx="5" fill="#f0e7d5" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="426" y="17" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">TailwindCSS 4</text>
    </g>

    <!-- Narrative Description -->
    <g transform="translate(0, 260)" class="serif-body" font-size="19" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">Casa Ananda is a cinematic luxury resort landing page built with Next.js 16</text>
      <text x="0" y="32">and React 19. The digital showcase mirrors the physical sanctuary: full-screen</text>
      <text x="0" y="64">hero video, smooth inertial scrolling powered by Lenis, and scrubbed scroll</text>
      <text x="0" y="96">timelines crafted with GSAP 3 that guide visitors through the resort suites.</text>
    </g>

    <line x1="0" y1="400" x2="560" y2="400" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <!-- Technical Architectural Highlights -->
    <g transform="translate(0, 440)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <!-- Item 1 -->
      <circle cx="6" cy="35" r="3" fill="#c46a2a" />
      <text x="22" y="39" class="sans" font-size="15" font-weight="600" fill="#25211c">Lenis Smooth Inertial Scrolling</text>
      <text x="22" y="60" class="serif-body" font-size="16" fill="#4d443a">Synchronized scroll physics giving effortless gliding momentum across sections.</text>

      <!-- Item 2 -->
      <circle cx="6" cy="105" r="3" fill="#c46a2a" />
      <text x="22" y="109" class="sans" font-size="15" font-weight="600" fill="#25211c">GSAP ScrollTrigger Choreography</text>
      <text x="22" y="130" class="serif-body" font-size="16" fill="#4d443a">Timeline scrubbed parallax reveals for suites, dining galleries, and amenities.</text>

      <!-- Item 3 -->
      <circle cx="6" cy="175" r="3" fill="#c46a2a" />
      <text x="22" y="179" class="sans" font-size="15" font-weight="600" fill="#25211c">Optimized Media Pipeline &amp; Tailwind 4</text>
      <text x="22" y="200" class="serif-body" font-size="16" fill="#4d443a">WebP asset optimization, responsive video posters, and minimal bundle footprint.</text>
    </g>

    <!-- Red Seal / Signature Stamp -->
    <g transform="translate(0, 780)">
      <rect x="0" y="0" width="170" height="64" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="8 2" opacity="0.85" />
      <text x="85" y="27" class="mono-caps" font-size="10" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="85" y="47" class="mono-caps" font-size="8.5" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="200" y="32" class="serif-body" font-size="15" font-style="italic" fill="#66594b">Crafted with Next.js 16, GSAP &amp; Lenis</text>
      <text x="200" y="52" class="mono-caps" font-size="9" fill="#887866">Vellayani, Trivandrum · Resort Showcase</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD: REAL APPLICATION WORK SHOWCASE ================= -->
  <g transform="translate(930, 90)">
    <!-- Mounted Mat Frame -->
    <rect x="0" y="0" width="730" height="990" rx="8" fill="#181310" filter="url(#plate-shadow-2)" />

    <!-- Browser Chrome Header Bar -->
    <rect x="0" y="0" width="730" height="42" rx="8" fill="#241e19" />
    <circle cx="24" cy="21" r="5.5" fill="#ff5f56" />
    <circle cx="42" cy="21" r="5.5" fill="#ffbd2e" />
    <circle cx="60" cy="21" r="5.5" fill="#27c93f" />

    <!-- URL Bar -->
    <rect x="90" y="8" width="460" height="26" rx="5" fill="#130e0b" />
    <text x="110" y="25" class="mono-caps" font-size="10" fill="#a08f80">https://casa-ananda.resort</text>

    <!-- Villa Graphic Illustration Artwork -->
    <g transform="translate(0, 42)">
      <!-- Sunset Sky Gradient -->
      <rect x="0" y="0" width="730" height="480" fill="url(#sunset-gold)" />
      <!-- Sun Glow -->
      <circle cx="260" cy="340" r="42" fill="#fff5d6" opacity="0.9" />

      <!-- Palm Trees Silhouettes -->
      <path d="M120,400 Q150,220 180,180 M180,180 Q130,170 90,195 M180,180 Q160,140 140,110 M180,180 Q210,130 240,120 M180,180 Q230,170 260,200" stroke="#2b2014" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M360,400 Q380,240 400,190 M400,190 Q350,180 320,200 M400,190 Q380,140 370,110 M400,190 Q430,140 460,130 M400,190 Q440,180 470,210" stroke="#2b2014" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7" />

      <!-- Villa Architecture Body -->
      <rect x="340" y="250" width="360" height="320" rx="4" fill="#38393e" />
      <rect x="300" y="320" width="410" height="250" rx="4" fill="#4a4c52" />
      <!-- Upper Terrace Railing -->
      <line x1="330" y1="248" x2="690" y2="248" stroke="#cbd0d8" stroke-width="4" />
      <line x1="330" y1="270" x2="690" y2="270" stroke="#cbd0d8" stroke-width="2.5" />

      <!-- Warm Interior Glow Windows -->
      <rect x="370" y="340" width="120" height="180" rx="2" fill="#ffdf94" opacity="0.9" />
      <rect x="520" y="340" width="160" height="180" rx="2" fill="#ffe9ad" opacity="0.92" />
      <!-- Window mullions -->
      <line x1="430" y1="340" x2="430" y2="520" stroke="#2a2520" stroke-width="3" />
      <line x1="600" y1="340" x2="600" y2="520" stroke="#2a2520" stroke-width="3" />

      <!-- Poolside Deck -->
      <polygon points="0,550 730,530 730,948 0,948" fill="#2b231c" />

      <!-- Turquoise Swimming Pool -->
      <polygon points="0,600 520,580 500,948 0,948" fill="#1b8899" />
      <!-- Pool Water Shimmer -->
      <path d="M40,660 Q120,640 200,660 T360,660 T500,640" stroke="#48d6eb" stroke-width="2.5" fill="none" opacity="0.6" />
      <path d="M20,740 Q100,720 220,740 T420,730" stroke="#48d6eb" stroke-width="2.5" fill="none" opacity="0.6" />
      <path d="M50,830 Q160,810 280,830 T460,820" stroke="#48d6eb" stroke-width="2.5" fill="none" opacity="0.6" />

      <!-- Underwater Lamps -->
      <circle cx="140" cy="710" r="12" fill="#fff5b8" opacity="0.8" />
      <circle cx="360" cy="690" r="12" fill="#fff5b8" opacity="0.8" />
      <circle cx="260" cy="810" r="12" fill="#fff5b8" opacity="0.8" />

      <!-- Tropical Greenery in Foreground -->
      <path d="M480,948 Q500,720 540,650 Q560,780 580,948" fill="#254d30" opacity="0.9" />
      <path d="M540,948 Q580,740 640,680 Q660,800 680,948" fill="#1b3b24" opacity="0.95" />
      <path d="M600,948 Q640,790 710,720 Q730,830 730,948" fill="#2d5e3a" opacity="0.9" />

      <!-- Casa Ananda Brand Emblem Overlay -->
      <g transform="translate(60, 48)">
        <circle cx="48" cy="48" r="40" fill="#181310" opacity="0.75" />
        <path d="M48,22 C58,28 66,38 66,50 C66,62 58,72 48,74 C38,72 30,62 30,50 C30,38 38,28 48,22 Z" fill="none" stroke="#e8984a" stroke-width="2.5" />
        <path d="M48,34 L48,56 M40,46 L56,46" stroke="#e8984a" stroke-width="2.5" />
        <text x="100" y="42" class="serif-display" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.1em">CASA</text>
        <text x="100" y="62" class="mono-caps" font-size="12" fill="#e8984a" letter-spacing="0.32em">ANANDA</text>
        <text x="100" y="78" class="mono-caps" font-size="8.5" fill="#f0dfcf" letter-spacing="0.22em">LUXURY RESORT · VELLAYANI</text>
      </g>

      <!-- Real Screenshot Fallback Layer -->
      <image href="casa-ananda-opengraph.jpg" x="0" y="0" width="730" height="948" preserveAspectRatio="xMidYMid slice" opacity="0.92" />
    </g>

    <!-- Bottom Caption inside Plate -->
    <text x="365" y="1030" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 2.0 — Casa Ananda villa exterior, twilight pool, and responsive GSAP scroll showcase.
    </text>
  </g>
</svg>
