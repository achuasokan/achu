<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 980" width="2000" height="980">
  <defs>
    <filter id="paper-grain-4" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#fffdf7" surfaceScale="1.1" result="light">
        <feDistantLight azimuth="65" elevation="55" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" in2="light" />
    </filter>

    <filter id="mounted-shadow-4" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#3c2c19" flood-opacity="0.18" />
    </filter>

    <linearGradient id="spine-crease-left-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#342410" stop-opacity="0" />
      <stop offset="75%" stop-color="#342410" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#342410" stop-opacity="0.32" />
    </linearGradient>

    <linearGradient id="spine-crease-right-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#342410" stop-opacity="0.32" />
      <stop offset="25%" stop-color="#342410" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#342410" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stack-edge-left-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d6caa9" />
      <stop offset="60%" stop-color="#e8dec6" />
      <stop offset="100%" stop-color="#f2ebd7" />
    </linearGradient>

    <linearGradient id="stack-edge-right-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2ebd7" />
      <stop offset="40%" stop-color="#e8dec6" />
      <stop offset="100%" stop-color="#d6caa9" />
    </linearGradient>
  </defs>

  <style>
    .serif-display { font-family: "Instrument Serif", Georgia, serif; }
    .serif-body { font-family: "Newsreader", "Times New Roman", Georgia, serif; }
    .mono-caps { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.18em; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- Physical Stacked Page Block Depth -->
  <path d="M 24 38 Q 22 490 24 942 Q 34 946 44 948 L 44 32 Q 34 35 24 38 Z" fill="url(#stack-edge-left-4)" opacity="0.9" />
  <line x1="28" y1="48" x2="28" y2="932" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />
  <line x1="34" y1="42" x2="34" y2="938" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />
  <line x1="40" y1="36" x2="40" y2="944" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />

  <path d="M 1976 38 Q 1978 490 1976 942 Q 1966 946 1956 948 L 1956 32 Q 1966 35 1976 38 Z" fill="url(#stack-edge-right-4)" opacity="0.9" />
  <line x1="1972" y1="48" x2="1972" y2="932" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />
  <line x1="1966" y1="42" x2="1966" y2="938" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />
  <line x1="1960" y1="36" x2="1960" y2="944" stroke="#bdae8c" stroke-width="0.8" opacity="0.6" />

  <!-- Left Open Page Surface -->
  <path d="M 64 26 C 50 26, 42 34, 42 50 L 42 930 C 42 946, 50 954, 64 954 C 340 952, 700 948, 1000 944 L 1000 36 C 700 32, 340 28, 64 26 Z" fill="#fbf7ee" />

  <!-- Right Open Page Surface -->
  <path d="M 1000 36 C 1300 32, 1660 28, 1936 26 C 1950 26, 1958 34, 1958 50 L 1958 930 C 1958 946, 1950 954, 1936 954 C 1660 952, 1300 948, 1000 944 Z" fill="#fdf9f2" />

  <rect x="42" y="26" width="1916" height="928" fill="#fcf8f0" opacity="0.15" filter="url(#paper-grain-4)" />

  <!-- Spine Shading -->
  <rect x="860" y="34" width="140" height="912" fill="url(#spine-crease-left-4)" />
  <rect x="1000" y="34" width="140" height="912" fill="url(#spine-crease-right-4)" />
  <line x1="1000" y1="36" x2="1000" y2="944" stroke="#322212" stroke-opacity="0.32" stroke-width="1.8" />

  <circle cx="1000" cy="140" r="2.8" fill="#25170b" opacity="0.65" />
  <circle cx="1000" cy="320" r="2.8" fill="#25170b" opacity="0.65" />
  <circle cx="1000" cy="510" r="2.8" fill="#25170b" opacity="0.65" />
  <circle cx="1000" cy="700" r="2.8" fill="#25170b" opacity="0.65" />
  <circle cx="1000" cy="860" r="2.8" fill="#25170b" opacity="0.65" />

  <!-- ================= LEFT SPREAD ================= -->
  <g transform="translate(100, 75)">
    <text x="0" y="24" class="mono-caps" font-size="11.5" fill="#8c775f" font-weight="600">PLATE IV · AUTOMOTIVE SHOWROOM</text>
    <text x="760" y="24" class="mono-caps" font-size="11.5" fill="#8c775f" text-anchor="end">EDITORIAL WEB UI · 2024</text>
    <line x1="0" y1="38" x2="760" y2="38" stroke="#2b2721" stroke-opacity="0.14" stroke-width="1" />

    <text x="0" y="98" class="serif-display" font-size="52" fill="#241f1a" letter-spacing="-0.01em">Tesla Experience</text>
    <text x="0" y="134" class="serif-display" font-style="italic" font-size="25" fill="#c02828">Automotive Web Platform &amp; Showroom</text>

    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="76" height="24" rx="4" fill="#eee5d3" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="38" y="16" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">HTML5</text>
      <rect x="84" y="0" width="76" height="24" rx="4" fill="#eee5d3" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="122" y="16" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">CSS3</text>
      <rect x="168" y="0" width="108" height="24" rx="4" fill="#eee5d3" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="222" y="16" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">JavaScript</text>
      <rect x="284" y="0" width="112" height="24" rx="4" fill="#eee5d3" stroke="#2b2721" stroke-opacity="0.15" />
      <text x="340" y="16" class="mono-caps" font-size="9" fill="#3b3228" text-anchor="middle">Responsive UI</text>
    </g>

    <g transform="translate(0, 230)" class="serif-body" font-size="18.5" fill="#2d2822">
      <text x="0" y="0" line-height="1.65">A pixel-accurate re-creation of Tesla’s flagship digital showroom, showcasing</text>
      <text x="0" y="30">the Model S pre-owned catalogue, multi-parameter location and trim filters,</text>
      <text x="0" y="60">and minimal editorial typography. Built with pure semantic web standards</text>
      <text x="0" y="90">and deployed on Vercel with instant edge responsiveness.</text>
    </g>

    <line x1="0" y1="365" x2="760" y2="365" stroke="#2b2721" stroke-opacity="0.1" stroke-width="1" />

    <g transform="translate(0, 400)">
      <text x="0" y="0" class="mono-caps" font-size="11" fill="#8c775f" font-weight="600">KEY ARCHITECTURAL HIGHLIGHTS</text>

      <g transform="translate(0, 28)">
        <circle cx="5" cy="8" r="3" fill="#c02828" />
        <text x="18" y="12" class="sans" font-size="14.5" font-weight="600" fill="#25211c">Automotive Specification Hierarchy</text>
        <text x="18" y="32" class="serif-body" font-size="15.5" fill="#4d443a">Pre-owned fleet filters by trim (P85, 85), mileage history, and location tags.</text>
      </g>

      <g transform="translate(0, 88)">
        <circle cx="5" cy="8" r="3" fill="#c02828" />
        <text x="18" y="12" class="sans" font-size="14.5" font-weight="600" fill="#25211c">High-Fidelity Studio Renders &amp; Contrast</text>
        <text x="18" y="32" class="serif-body" font-size="15.5" fill="#4d443a">Precise lighting ramps, vehicle shadows, and metallic red finish presentation.</text>
      </g>

      <g transform="translate(0, 148)">
        <circle cx="5" cy="8" r="3" fill="#c02828" />
        <text x="18" y="12" class="sans" font-size="14.5" font-weight="600" fill="#25211c">Fluid Responsive Grid Breakdown</text>
        <text x="18" y="32" class="serif-body" font-size="15.5" fill="#4d443a">Seamless scaling across desktop monitor widths down to compact mobile screens.</text>
      </g>
    </g>

    <g transform="translate(0, 700)">
      <rect x="0" y="0" width="165" height="58" rx="4" fill="none" stroke="#b03e33" stroke-width="1.8" stroke-dasharray="7 2" opacity="0.85" />
      <text x="82" y="24" class="mono-caps" font-size="9.5" fill="#b03e33" text-anchor="middle" font-weight="700">ACHU ASOKAN</text>
      <text x="82" y="42" class="mono-caps" font-size="8" fill="#b03e33" text-anchor="middle">FULL STACK VERIFIED</text>

      <text x="190" y="28" class="serif-body" font-size="15" font-style="italic" fill="#66594b">tesla-clone-sage-three.vercel.app</text>
      <text x="190" y="48" class="mono-caps" font-size="8.5" fill="#887866">Live Production Deployment</text>
    </g>
  </g>

  <!-- ================= RIGHT SPREAD ================= -->
  <g transform="translate(1080, 75)">
    <g filter="url(#mounted-shadow-4)">
      <rect x="0" y="0" width="770" height="740" rx="8" fill="#ffffff" />
      <rect x="0" y="0" width="770" height="38" rx="8" fill="#222222" />
      <circle cx="20" cy="19" r="5" fill="#ff5f56" />
      <circle cx="36" cy="19" r="5" fill="#ffbd2e" />
      <circle cx="52" cy="19" r="5" fill="#27c93f" />

      <rect x="80" y="7" width="500" height="24" rx="4" fill="#141414" />
      <text x="96" y="23" class="mono-caps" font-size="9.5" fill="#8e8e8e">https://tesla-clone-sage-three.vercel.app</text>

      <!-- Tesla UI -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="770" height="702" fill="#ffffff" />

        <!-- Nav -->
        <rect x="0" y="0" width="770" height="46" fill="#222222" />
        <text x="36" y="28" class="sans" font-size="13.5" font-weight="900" fill="#ffffff" letter-spacing="0.28em">TESLA</text>
        <g transform="translate(180, 28)" class="sans" font-size="11" font-weight="600" fill="#d0d0d0" letter-spacing="0.08em">
          <text x="0" y="0">MODEL S</text>
          <text x="80" y="0">MODEL X</text>
          <text x="160" y="0">SUPERCHARGER</text>
          <text x="290" y="0">UPDATES</text>
        </g>

        <!-- Model S Content -->
        <g transform="translate(36, 32)">
          <text x="0" y="28" class="sans" font-size="28" font-weight="300" fill="#333333">MODEL S</text>
          <text x="0" y="56" class="sans" font-size="15" font-weight="600" fill="#555555">Pre-Owned Model S</text>
          <text x="0" y="74" class="sans" font-size="11.5" fill="#888888">Every pre-owned Model S comes with a 4 year, 50,000 mile limited warranty.</text>

          <!-- Featured Car Silhouette -->
          <g transform="translate(40, 80)">
            <path d="M60,120 Q140,50 280,44 Q420,44 540,110 Q580,124 580,146 Q580,160 520,160 L80,160 Q40,160 40,146 Z" fill="#cc1c24" />
            <path d="M160,110 Q220,60 320,58 Q400,58 460,110 Z" fill="#181818" />
            <circle cx="160" cy="155" r="28" fill="#111111" stroke="#888888" stroke-width="3" />
            <circle cx="460" cy="155" r="28" fill="#111111" stroke="#888888" stroke-width="3" />
            <circle cx="160" cy="155" r="12" fill="#e0e0e0" />
            <circle cx="460" cy="155" r="12" fill="#e0e0e0" />
          </g>

          <!-- Filter Controls -->
          <g transform="translate(0, 270)">
            <text x="0" y="18" class="sans" font-size="12" font-weight="600" fill="#666666">Filter</text>
            <rect x="45" y="0" width="180" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
            <text x="56" y="18" class="sans" font-size="11" fill="#444444">San Francisco Bay Area ▾</text>
            <rect x="235" y="0" width="140" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
            <text x="246" y="18" class="sans" font-size="11" fill="#444444">Any Model S ▾</text>
            <rect x="385" y="0" width="110" height="28" rx="3" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" />
            <text x="396" y="18" class="sans" font-size="11" fill="#444444">Any Color ▾</text>
          </g>

          <!-- 3 Car Cards -->
          <g transform="translate(0, 318)">
            <g transform="translate(0, 0)">
              <rect x="0" y="0" width="224" height="200" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
              <ellipse cx="112" cy="76" rx="76" ry="28" fill="#cc1c24" />
              <text x="112" y="140" class="sans" font-size="16" font-weight="700" fill="#cc1c24" text-anchor="middle">P85</text>
              <text x="112" y="162" class="sans" font-size="11" fill="#777777" text-anchor="middle">2012 · 37,187 miles · $53,650</text>
            </g>
            <g transform="translate(238, 0)">
              <rect x="0" y="0" width="224" height="200" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
              <ellipse cx="112" cy="76" rx="76" ry="28" fill="#cc1c24" />
              <text x="112" y="140" class="sans" font-size="16" font-weight="700" fill="#444444" text-anchor="middle">85</text>
              <text x="112" y="162" class="sans" font-size="11" fill="#777777" text-anchor="middle">2013 · 19,248 miles · $55,150</text>
            </g>
            <g transform="translate(476, 0)">
              <rect x="0" y="0" width="224" height="200" rx="4" fill="#fafafa" stroke="#eeeeee" stroke-width="1" />
              <ellipse cx="112" cy="76" rx="76" ry="28" fill="#444a50" />
              <text x="112" y="140" class="sans" font-size="16" font-weight="700" fill="#444444" text-anchor="middle">85</text>
              <text x="112" y="162" class="sans" font-size="11" fill="#777777" text-anchor="middle">2013 · 13,056 miles · $56,150</text>
            </g>
          </g>
        </g>
      </g>
    </g>

    <text x="385" y="785" class="serif-body" font-size="15" font-style="italic" fill="#5c5040" text-anchor="middle">
      Fig 4.0 — Tesla Model S pre-owned fleet catalogue with multi-filter query states.
    </text>

    <!-- Hanko Artist Seal & Date Stamp -->
    <g transform="translate(710, 785)">
      <rect x="0" y="0" width="34" height="34" rx="3" fill="#a83c2e" opacity="0.9" />
      <path d="M17,6 L17,28 M10,13 L24,13 M10,21 L24,21 M10,8 L10,26 M24,8 L24,26" stroke="#ffffff" stroke-width="1.4" opacity="0.85" />
      <text x="17" y="48" class="mono-caps" font-size="9" fill="#7a6b5a" text-anchor="middle" font-weight="600">AUG 2024</text>
    </g>
  </g>
</svg>
